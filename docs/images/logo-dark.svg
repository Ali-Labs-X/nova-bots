<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Nova Bots">
  <defs>
    <linearGradient id="nb-spark" x1="150" y1="120" x2="460" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset=".5" stop-color="#5B4BE8"/>
      <stop offset="1" stop-color="#0FA9C4"/>
    </linearGradient>
    <radialGradient id="nb-nebula" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#22D3EE" stop-opacity=".08"/>
      <stop offset="1" stop-color="#F7F7FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nb-ring" x1="90" y1="300" x2="510" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset=".35" stop-color="#7C5CFF" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#0FA9C4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0FA9C4" stop-opacity="0"/>
    </linearGradient>
    <filter id="nb-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" rx="132" fill="#F7F7FC"/>
  <rect width="600" height="600" rx="132" fill="url(#nb-nebula)"/>
  <g fill="#5B4BE8">
    <circle cx="120" cy="132" r="2.4" opacity=".45"/>
    <circle cx="470" cy="118" r="1.8" opacity=".35"/>
    <circle cx="500" cy="452" r="2.2" opacity=".4"/>
    <circle cx="112" cy="438" r="1.6" opacity=".3"/>
    <circle cx="330" cy="92" r="1.4" opacity=".35"/>
    <circle cx="196" cy="492" r="2" opacity=".3"/>
  </g>

  <ellipse cx="300" cy="300" rx="212" ry="86" fill="none" stroke="url(#nb-ring)" stroke-width="2.5" transform="rotate(-18 300 300)"/>
  <ellipse cx="300" cy="300" rx="176" ry="66" fill="none" stroke="#7C5CFF" stroke-opacity=".18" stroke-width="1.4" stroke-dasharray="3 12" stroke-linecap="round" transform="rotate(24 300 300)"/>

  <g filter="url(#nb-glow)">
    <path d="M300 118C314 228 372 286 482 300 372 314 314 372 300 482 286 372 228 314 118 300 228 286 286 228 300 118Z" fill="url(#nb-spark)"/>
  </g>
  <path d="M300 118C314 228 372 286 482 300 372 314 314 372 300 482 286 372 228 314 118 300 228 286 286 228 300 118Z" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="418" cy="182" r="7" fill="#0FA9C4"/>
  <circle cx="418" cy="182" r="15" fill="#0FA9C4" fill-opacity=".14"/>

  <text x="300" y="546" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="9" fill="#1B1830">NOVA BOTS</text>
</svg>
