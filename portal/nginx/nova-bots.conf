# Nova Bots — the workspace's own web front end.
#
# It serves the landing page and the sign-in page, forwards the account API
# and the app to the portal, and passes the engine's own static files straight
# through. The portal is the only component that talks to the engine, so the
# session check and the launch token live in one place.

upstream nova_bots_portal {
    server host.docker.internal:13081;
    keepalive 16;
}

upstream nova_bots_engine {
    server nova-bots:3080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /srv;
    index landing.html;

    client_max_body_size 64m;

    # The public pages.
    location = / {
        try_files /landing.html =404;
    }
    location = /login {
        try_files /login.html =404;
    }
    location = /favicon.svg {
        proxy_pass http://nova_bots_engine;
    }

    # The account API.
    location /api/v1/auth/ {
        proxy_pass http://nova_bots_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # The app and the engine's own surface. The portal decides whether the
    # visitor may through.
    location / {
        proxy_pass http://nova_bots_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The tunnel terminates TLS at Cloudflare's edge and forwards the original
# scheme. Keep it, so the portal knows the browser is on https.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
