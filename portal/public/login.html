<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060010" />
    <meta name="description" content="Sign in to Nova Bots — your premium self-hosted AI team on your hardware" />
    <title>Nova Bots — Sign in</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #060010;
        --bg-subtle: #0f1530;
        --panel: rgba(22, 28, 60, 0.58);
        --panel-2: rgba(22, 28, 60, 0.55);
        --ink: #f4f3ff;
        --ink-2: rgba(228, 228, 245, 0.7);
        --ink-3: rgba(228, 228, 245, 0.4);
        --violet: #7c5cff;
        --violet-2: #a78bfa;
        --cyan: #22d3ee;
        --cyan-2: #66e4ff;
        --line: rgba(150, 140, 220, 0.18);
        --line-2: rgba(150, 140, 220, 0.32);
        --radius: 11px;
        --radius-lg: 18px;
        --radius-sm: 9px;
        --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --glow-violet: rgba(124, 92, 255, 0.4);
        --glow-cyan: rgba(34, 211, 238, 0.3);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; height: 100%; }
      body {
        min-height: 100vh; margin: 0; font-family: var(--font);
        background: var(--bg); color: var(--ink);
        overflow: hidden; -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column;
      }
      ::selection { background: var(--violet); color: var(--bg); }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: rgba(124, 92, 255, 0.45); border-radius: 3px; }

      /* ============ GLOW BACKGROUND ============ */
      .glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; background:
        radial-gradient(ellipse at 20% 20%, rgba(124, 92, 255, 0.32), transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(34, 211, 238, 0.18), transparent 55%);
      }
      .stars { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.55;
        background-image:
          radial-gradient(1px 1px at 25px 35px, rgba(255,255,255,0.9), transparent 50%),
          radial-gradient(1px 1px at 120px 88px, rgba(196, 181, 253, 0.6), transparent 50%),
          radial-gradient(1.2px 1.2px at 208px 180px, rgba(94, 231, 247, 0.55), transparent 50%),
          radial-gradient(1px 1px at 305px 58px, rgba(255,255,255,0.5), transparent 50%),
          radial-gradient(1px 1px at 75px 255px, rgba(255,255,255,0.4), transparent 50%),
          radial-gradient(1.5px 1.5px at 345px 302px, rgba(139, 124, 255, 0.65), transparent 50%);
        background-size: 380px 380px; }

      /* ============ WRAP ============ */
      .wrap {
        position: relative; z-index: 2; flex: 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 32px 20px 40px;
      }

      .spark-promo {
        display: flex; align-items: center; gap: 14px; margin-bottom: 28px;
        -webkit-text-fill-color: unset; color: var(--ink-2); font-size: 12.5px; letter-spacing: 0.02em;
      }
      .spark-promo svg { filter: drop-shadow(0 0 14px rgba(124, 92, 255, 0.85)); }
      .spark-promo em { font-style: normal; color: var(--violet-2); font-weight: 600; }

      /* ============ CARD ============ */
      .card {
        width: 100%; max-width: 420px;
        background: var(--panel);
        border: 1px solid var(--line); border-radius: var(--radius-lg);
        padding: 30px 28px 26px;
        backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: 0 32px 80px -34px rgba(0, 0, 0, 0.96), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        position: relative;
      }
      .card::before {
        content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(124, 92, 255, 0.75), rgba(34, 211, 238, 0.5), transparent);
      }

      .hgroup { margin-bottom: 18px; }
      h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      h1 em { font-style: normal; background: linear-gradient(120deg, #c4b5fd, #7c5cff, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .lead { color: var(--ink-2); font-size: 12.5px; line-height: 1.55; }

      .field { margin-bottom: 13px; }
      .field label { display: block; margin-bottom: 6px; color: var(--ink-2); font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
      .field input {
        width: 100%; height: 44px; padding: 0 13px; border-radius: var(--radius-sm);
        border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink);
        font: inherit; font-size: 13.5px; outline: none;
        transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
      }
      .field input::placeholder { color: var(--ink-3); }
      .field input:focus { border-color: rgba(124, 92, 255, 0.8); background: rgba(255, 255, 255, 0.06); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2), 0 0 20px -6px rgba(124, 92, 255, 0.5); }

      .password { position: relative; }
      .password input { padding-right: 62px; }
      .password input:focus { border-color: rgba(124, 92, 255, 0.8); }
      .toggle { position: absolute; top: 50%; right: 7px; transform: translateY(-50%); padding: 4px 8px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); font: inherit; font-size: 11px; cursor: pointer; }
      .toggle:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }

      .error { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px; padding: 10px 12px; border: 1px solid rgba(249, 138, 138, 0.3); border-radius: var(--radius-sm); background: rgba(249, 138, 138, 0.1); color: #f98a8a; font-size: 12px; line-height: 1.5; }
      .error[hidden] { display: none; }

      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; height: 44px; border: 0; border-radius: var(--radius-sm); font: inherit;
        font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em; cursor: pointer;
        transition: transform 0.14s, filter 0.18s, box-shadow 0.18s, background-color 0.18s;
        text-decoration: none;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--violet) 0%, var(--violet-2) 40%, var(--cyan) 100%);
        color: #060010; box-shadow: 0 12px 32px -12px rgba(124, 92, 255, 0.85);
      }
      .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 16px 40px -14px rgba(34, 211, 238, 0.6); }

      .divider { display: flex; align-items: center; gap: 14px; margin: 18px 0; color: var(--ink-3); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
      .divider::after, .divider::before { content: ""; flex: 1; height: 1px; background: var(--line); }

      .switch { text-align: center; font-size: 12px; color: var(--ink-2); margin-top: 14px; }
      .switch button { background: transparent; border: 0; font: inherit; font-weight: 700; color: var(--cyan-2); cursor: pointer; padding: 0; border-bottom: 1px solid color-mix(in srgb, var(--cyan) 40%, transparent); }
      .switch button:hover { color: #7ff0ff; }

      .foot { text-align: center; margin-top: 22px; color: var(--ink-3); font-size: 11px; }
      .foot a { color: var(--ink-2); text-decoration: none; }
      .foot a:hover { color: var(--cyan-2); }

      .back { position: absolute; top: 16px; left: 20px; color: var(--ink-3); text-decoration: none; font-size: 12px; display: flex; align-items: center; gap: 5px; }
      .back:hover { color: var(--cyan-2); }

      @media (max-width: 440px) {
        .card { padding: 22px 18px 20px; border-radius: 14px; }
        .wrap { padding: 24px 14px; }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>

    <main class="wrap">
      <a class="back" href="/">←  Back to home</a>

      <div class="spark-promo">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <defs><linearGradient id="lk-logo" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C4B5FD"/><stop offset=".52" stop-color="#6D5EFC"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
          <path d="M24 2.5C26 15 33 22 45.5 24 33 26 26 33 24 45.5 22 33 15 26 2.5 24 15 22 22 15 24 2.5Z" fill="url(#lk-logo)"/>
          <circle cx="37.6" cy="10.4" r="2.7" fill="#5EE7F7" opacity=".9"/>
        </svg>
        <span>Nova Bots · <em>your AI team on your hardware</em></span>
      </div>

      <div class="card">
        <div class="hgroup">
          <h1 id="form-title">Welcome back. <em>Let's ship.</em></h1>
          <p class="lead" id="form-lead">Sign in to your private Nova Bots workspace.</p>
        </div>

        <form id="account-form" method="post" action="/api/v1/auth/login/local">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required autofocus />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required />
              <button type="button" class="toggle" id="password-toggle" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="field" id="confirm-field" hidden>
            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm_password" type="password" autocomplete="new-password" placeholder="Type it again" />
          </div>

          <p class="error" id="form-error" role="alert" hidden></p>

          <button type="submit" class="btn btn-primary" id="submit">Sign in</button>
        </form>

        <div class="divider">or</div>

        <p class="switch" id="switch-signup" hidden>No account yet? <button type="button" id="to-signup">Create one</button></p>
        <p class="switch" id="switch-request">No account yet? <a id="request-access" href="mailto:jahanzaib@alilabs.com?subject=Nova%20Bots%20access">Request access</a></p>
        <p class="switch" id="switch-login" hidden>Already have an account? <button type="button" id="to-login">Sign in</button></p>
      </div>

      <footer class="foot">Nova Bots · Apache 2.0 · <a href="https://alilabsx.com/" target="_blank" rel="noopener">Ali Labs</a> · <a href="https://nova.alilabsx.com/" target="_blank" rel="noopener">Nova</a> · <a href="https://github.com/Jahanzaib211/nova-bots" target="_blank" rel="noopener">GitHub</a> · <a href="https://www.linkedin.com/in/jahanzaib-ali-labsx" target="_blank" rel="noopener">LinkedIn</a></footer>
    </main>

    <script>
      (function () {
        var form = document.getElementById("account-form");
        var email = document.getElementById("email");
        var password = document.getElementById("password");
        var passwordToggle = document.getElementById("password-toggle");
        var submit = document.getElementById("submit");
        var formError = document.getElementById("form-error");
        var title = document.getElementById("form-title");
        var lead = document.getElementById("form-lead");
        var confirmField = document.getElementById("confirm-field");
        var confirm = document.getElementById("confirm");
        var toSignup = document.getElementById("to-signup");
        var toLogin = document.getElementById("to-login");
        var switchSignup = document.getElementById("switch-signup");
        var switchLogin = document.getElementById("switch-login");

        var LOGIN_PATH = "/api/v1/auth/login/local";
        var REGISTER_PATH = "/api/v1/auth/register";
        var signingUp = false;

        function showError(node, m) { node.textContent = m; node.hidden = false; }
        function clearError(node) { node.textContent = ""; node.hidden = true; }

        passwordToggle.addEventListener("click", function () {
          var showing = password.type === "text";
          password.type = showing ? "password" : "text";
          passwordToggle.textContent = showing ? "Show" : "Hide";
          passwordToggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
          passwordToggle.setAttribute("aria-pressed", showing ? "false" : "true");
        });

        function post(path, fields) {
          return fetch(path, { method: "POST", credentials: "same-origin", headers: { "content-type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(fields).toString() });
        }

        function setMode(signUp) {
          signingUp = signUp;
          clearError(formError);
          title.innerHTML = signUp ? 'Create your account. <em>Your own private workspace.</em>' : 'Welcome back. <em>Let\'s ship.</em>';
          lead.textContent = signUp
            ? "Pick a password. Your own private AI team is set up for you on first sign-in."
            : "Sign in to your private Nova Bots workspace.";
          submit.textContent = signUp ? "Create account" : "Sign in";
          form.setAttribute("action", signUp ? REGISTER_PATH : LOGIN_PATH);
          const autocompleteValue = (signUp ? "new" : "current") + "-password";
          password.setAttribute("autocomplete", autocompleteValue);
          confirmField.hidden = !signUp;
          switchSignup.hidden = signUp || !signupOpen;
          switchRequest.hidden = signUp || signupOpen;
          switchLogin.hidden = !signUp;
        }

        // The portal says whether sign-up is open; when it is not, the page
        // offers "Request access" instead of a form that would refuse.
        var signupOpen = false;
        var switchRequest = document.getElementById("switch-request");
        fetch("/api/v1/auth/setup-status", { credentials: "same-origin" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (status) {
            if (!status) return;
            signupOpen = status.signup_open === true;
            if (status.support_contact) {
              document.getElementById("request-access").setAttribute("href", "mailto:" + status.support_contact + "?subject=Nova%20Bots%20access");
            }
            if (!signingUp) { switchSignup.hidden = !signupOpen; switchRequest.hidden = signupOpen; }
            if (signupOpen && /[?&]signup=1/.test(window.location.search)) setMode(true);
          })
          .catch(function () {});

        toSignup.addEventListener("click", function () { setMode(true); email.focus(); });
        toLogin.addEventListener("click", function () { setMode(false); email.focus(); });

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          clearError(formError);
          var user = email.value.trim();
          var secret = password.value;
          if (!user || !secret) { showError(formError, "Enter your email and password."); return; }
          if (signingUp && secret.length < 8) { showError(formError, "Use at least 8 characters."); password.focus(); return; }
          if (signingUp && confirm.value !== secret) { showError(formError, "The passwords do not match."); confirm.focus(); return; }

          var label = submit.textContent;
          submit.disabled = true;
          submit.textContent = signingUp ? "Creating…" : "Signing in…";

          var done = function (resp) {
            if (resp.ok) { window.location.assign("/app/"); return null; }
            if (resp.status === 401 || resp.status === 403) {
              return resp.text().then(function (raw) {
                var m = raw; try { m = JSON.parse(raw)?.detail?.message ?? raw; } catch (e) {}
                showError(formError, m || (signingUp ? "That account could not be created." : "Incorrect email or password."));
                password.value = "";
                password.focus();
              });
            }
            if (resp.status === 409 || resp.status === 429) { return resp.text().then(function (raw) { var m = raw; try { m = JSON.parse(raw)?.detail?.message ?? raw; } catch (e) {} showError(formError, m); }); }
            if (resp.status === 400) { return resp.text().then(function (raw) { var m = raw; try { m = JSON.parse(raw)?.detail?.message ?? raw; } catch (e) {} showError(formError, m || "Check the details and try again."); }); }
            showError(formError, "Something went wrong. Please try again.");
            return null;
          };

          var path = signingUp ? REGISTER_PATH : LOGIN_PATH;
          var fields = signingUp ? { email: user, password: secret } : { username: user, password: secret };
          post(path, fields)
            .then(done)
            .catch(function () { showError(formError, "Could not reach the sign-in service. Please try again."); })
            .then(function () { submit.disabled = false; submit.textContent = label; });
        });
      })();
    </script>
  </body>
</html>
