# Nova Bots web front end -- nginx configuration

upstream nova_bots_portal {
    server host.docker.internal:13081;
    keepalive 16;
}

upstream nova_bots_engine {
    server nova-bots:3080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /srv;
    index landing.html;

    client_max_body_size 64m;

    # The public pages.
    location = / {
        try_files /landing.html =404;
    }
    location = /login {
        try_files /login.html =404;
    }
    # Our own icon, served from the portal's own files. The engine's icon is
    # the runtime's brand; the edge must not show it as ours.
    location = /nova-icon.svg {
        try_files /nova-icon.svg =404;
    }

    # The account API.
    location /api/v1/auth/ {
        proxy_pass http://nova_bots_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket endpoints: long timeouts, no buffering, proxy keepalive.
    location ~* ^/app/(api/remote\.mux|api/plugins/events|api/events)$ {
        proxy_pass http://nova_bots_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
        proxy_cache off;
    }

    # The app and the engine's own surface. The portal decides whether the
    # visitor may through.
    location / {
        proxy_pass http://nova_bots_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_socket_keepalive on;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}