# Image-owned overlay: the container is the sandbox boundary, so only full
# access is offered, and the Bots' working folder is /workspace. The webserver
# bind host/port come from a second overlay the entrypoint writes per start.
- id: permission
  config:
    presets:
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Full access
        description: The container is the boundary. Bots can change every file it can see.
    defaultPreset: danger-full-access
# A browser's answer to a ping waits behind the data still on its way there. On a
# slow line a chat takes longer than the two seconds the engine allows by
# default, twice: it hangs up, and the browser starts the same download again.
- id: typert-gateway
  config:
    websocketHeartbeatIntervalMs: 30000
- id: bot
  config:
    workspace: /workspace
    # Where picking a folder starts: the host folder from HOST_SHARE.
    # The portal lists and mounts other folders of the host for its owner.
    hostApi: /api/v1/host/
    places:
      - { path: /host, title: This computer }
    # The image is updated by rebuilding it, so the plugin never asks a
    # registry or a repository whether a newer release exists. Nothing reaches
    # the network to find out.
    updateCheck: false
